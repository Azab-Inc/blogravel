<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eeaf62"/>
      <stop offset="100%" stop-color="#e5a24d"/>
    </linearGradient>
  </defs>
  
  <!-- Share/connection icon -->
  <g transform="translate(10, 18)">
    <!-- Top node -->
    <circle cx="12" cy="0" r="5" fill="url(#gold)"/>
    <!-- Bottom-left node -->
    <circle cx="0" cy="24" r="5" fill="url(#gold)"/>
    <!-- Bottom-right node -->
    <circle cx="24" cy="24" r="5" fill="url(#gold)"/>
    <!-- Connecting lines -->
    <line x1="12" y1="5" x2="4" y2="20" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="5" x2="20" y2="20" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Blog (bold, dark) -->
  <text x="56" y="56" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1" fill="#102542">Blog</text>
  
  <!-- ravel (regular, gold) -->
  <text x="189" y="56" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="400" letter-spacing="-1" fill="url(#gold)">ravel</text>
</svg>
