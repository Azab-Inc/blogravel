services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: "/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan octane:start --server=${OCTANE_SERVER:-frankenphp} --host=0.0.0.0 --admin-port=2019 --port=80"
            XDG_CONFIG_HOME:  /var/www/html/config 
            XDG_DATA_HOME:  /var/www/html/data 
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        ports:
            - '${APP_PORT:-8080}:80'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s
    pgsql:
        image: 'postgres:18-alpine'
        environment:
            PGPASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
            start_period: 10s
        restart: unless-stopped
    # Development-only database inspector; never enable this profile in production.
    pgadmin:
        image: 'dpage/pgadmin4'
        profiles:
            - development
        ports:
            - '${FORWARD_PGADMIN_PORT:-5050}:80'
        environment:
            PGADMIN_DEFAULT_EMAIL: '${PGADMIN_DEFAULT_EMAIL:-admin@blogravel.dev}'
            PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_DEFAULT_PASSWORD:-local-development-only-password}'
            PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
        volumes:
            - 'sail-pgadmin:/var/lib/pgadmin'
            - './docker/pgadmin/servers.json:/pgadmin4/servers.json'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
    redis:
        image: 'redis:alpine'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
            start_period: 5s
        restart: unless-stopped
    mailpit:
        image: 'axllent/mailpit:latest'
        profiles:
            - development
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    queue:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        restart: unless-stopped
        command: >
            /bin/bash -c "php artisan queue:work redis --sleep=3 --tries=3 --timeout=0 --verbose"
        healthcheck:
            test:
                - CMD-SHELL
                - pgrep -f 'artisan queue:work' >/dev/null
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
    scheduler:
        image: 'sail-8.5/app'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        restart: unless-stopped
        command: php artisan schedule:work --no-interaction
        healthcheck:
            test:
                - CMD-SHELL
                - pgrep -f 'artisan schedule:work' >/dev/null
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-pgadmin:
        driver: local
    sail-redis:
        driver: local
