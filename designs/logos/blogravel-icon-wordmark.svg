<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" width="380" height="60">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eeaf62"/>
      <stop offset="100%" stop-color="#e5a24d"/>
    </linearGradient>
  </defs>
  
  <!-- Share/connection icon -->
  <g transform="translate(0, 8)">
    <circle cx="12" cy="0" r="5" fill="url(#gold)"/>
    <circle cx="0" cy="24" r="5" fill="url(#gold)"/>
    <circle cx="24" cy="24" r="5" fill="url(#gold)"/>
    <line x1="12" y1="5" x2="4" y2="20" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="5" x2="20" y2="20" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Blog -->
  <text x="42" y="44" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.5" fill="#102542">Blog</text>
  
  <!-- ravel -->
  <text x="149" y="44" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="400" letter-spacing="-1.5" fill="url(#gold)">ravel</text>
</svg>
