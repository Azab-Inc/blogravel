services:
    prepare-composer:
        build:
            context: '.'
            dockerfile: docker/production/Dockerfile
            target: runtime-base
        image: 'blogravel-production-base'
        working_dir: /app
        volumes:
            - '.:/app'
        networks:
            - sail
        command: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

    prepare-frontend:
        image: 'node:22-bookworm-slim'
        working_dir: /app
        volumes:
            - '.:/app'
        networks:
            - sail
        command: sh -c "npm ci --ignore-scripts && npm run build"

    laravel.test:
        build:
            context: '.'
            dockerfile: docker/production/Dockerfile
        image: 'blogravel-production'
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            CONTAINER_ROLE: web
            PORT: 8080
            XDG_CONFIG_HOME: /config
            XDG_DATA_HOME: /data
        volumes:
            - '.:/app'
        ports:
            - '${APP_PORT:-8080}:8080'
        networks:
            - sail
        depends_on:
            prepare-composer:
                condition: service_completed_successfully
            prepare-frontend:
                condition: service_completed_successfully
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s

    pgsql:
        image: 'postgres:18-alpine'
        environment:
            PGPASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set}'
        volumes:
            - './docker/volumes/pgsql:/var/lib/postgresql'
            - './docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
            start_period: 10s
        restart: unless-stopped

    redis:
        image: 'redis:alpine'
        volumes:
            - './docker/volumes/redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
            start_period: 5s
        restart: unless-stopped

    queue:
        image: 'blogravel-production'
        entrypoint: php
        command: artisan queue:work redis --sleep=3 --tries=3 --timeout=0 --verbose
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            CONTAINER_ROLE: worker
            XDG_CONFIG_HOME: /config
            XDG_DATA_HOME: /data
        volumes:
            - '.:/app'
        networks:
            - sail
        depends_on:
            prepare-composer:
                condition: service_completed_successfully
            prepare-frontend:
                condition: service_completed_successfully
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - php artisan about >/dev/null 2>&1
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    scheduler:
        image: 'blogravel-production'
        entrypoint: php
        command: artisan schedule:work --no-interaction
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            CONTAINER_ROLE: scheduler
            XDG_CONFIG_HOME: /config
            XDG_DATA_HOME: /data
        volumes:
            - '.:/app'
        networks:
            - sail
        depends_on:
            prepare-composer:
                condition: service_completed_successfully
            prepare-frontend:
                condition: service_completed_successfully
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - php artisan about >/dev/null 2>&1
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

networks:
    sail:
        driver: bridge
