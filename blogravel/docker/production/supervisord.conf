[supervisord]
nodaemon=true
user=appuser
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:http]
command=frankenphp run --config /etc/caddy/Caddyfile
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work database --sleep=3 --tries=3 --timeout=0
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
